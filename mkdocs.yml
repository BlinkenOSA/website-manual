site_name: Blinken OSA Website Editorial Manual
site_description: Editorial guide for publishing website content with Strapi

nav:
  - Home: index.md
  - Working in Strapi: working-in-strapi.md
  - Profiles and visual identity: profiles.md
  - Content components: components.md
  - Collection types:
      - Overview: collection-types/index.md
      - Homepage and site administration:
          - Home Page Carousel: collection-types/home-page-carousel.md
          - Credo: collection-types/credo.md
          - URL Redirects: collection-types/url-redirects.md
      - Pages and editorial content:
          - Page: collection-types/page.md
          - News: collection-types/news.md
          - Event: collection-types/event.md
          - Entry: collection-types/entry.md
          - Collection: collection-types/collection.md
          - Project: collection-types/project.md
          - External Page: collection-types/external-page.md
      - Special content types:
          - Annual Report: collection-types/annual-report.md
          - Staff:
              - Staff records: collection-types/staff.md
              - Appearances: collection-types/appearance.md
              - Courses: collection-types/course.md
              - Publications: collection-types/publication.md
          - Fellow: collection-types/fellow.md
          - Intern: collection-types/intern.md
          - Job: collection-types/job.md
  - Publishing checklist: publishing-checklist.md
  - Implementation notes: implementation-notes.md

theme:
  name: material
  locale: en
  font: false
  logo: assets/archivum-logo.svg
  favicon: assets/archivum-logo.svg
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

copyright: Maintained alongside the Strapi CMS and Next.js website
