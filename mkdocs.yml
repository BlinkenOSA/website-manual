site_name: Blinken OSA Website Editorial Manual
site_description: Editorial guide for publishing website content with Strapi

nav:
  - Home: index.md
  - Working in Strapi: working-in-strapi.md
  - Content components: components.md
  - Collection types:
      - Pages and editorial content: collection-types/editorial-content.md
      - People and opportunities: collection-types/people.md
      - Homepage and supporting data: collection-types/supporting.md
  - Publishing checklist: publishing-checklist.md
  - Implementation notes: implementation-notes.md

theme:
  name: material
  locale: en
  font: false
  logo: assets/archivum-logo.svg
  favicon: assets/archivum-logo.svg
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

copyright: Maintained alongside the Strapi CMS and Next.js website
